<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Vue Basics</title>
</head>
<body>
    <div id="app">
        <header>
            <span>😊</span>
        </header>
        <main>
            <h1>Hello {{name}}</h1>
            <p>Im about to learn Vue.js</p>
        </main>
        <footer>

        </footer>
    </div>
    <script>
        const {createApp, ref} = Vue
        createApp({
            setup() {
                const name = "Ronnie"
                return {name}
            }
        }).mount('#app')
    </script>
</body>
</html>
